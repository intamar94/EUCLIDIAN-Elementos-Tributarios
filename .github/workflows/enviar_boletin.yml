name: Enviar boletín

# El envío sigue siendo manual. Antes de generar o enviar, el filtro
# automático vuelve a comprobar las dos fuentes oficiales.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Que hacer'
        required: true
        default: 'ver'
        type: choice
        options: [ver, prueba, enviar]
      correo_prueba:
        description: 'Correo para la prueba'
        required: false
        default: ''
      desde:
        description: 'Fecha inicial (AAAA-MM-DD)'
        required: false
        default: ''
        type: string

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Verificación final obligatoria
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          python verificador_aprobacion.py --auto-aprobar --limite 300
      - name: Control de calidad estricto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          python control_calidad.py --enlaces 25 --estricto
      - name: Generar el borrador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          ARGS="--guardar"
          if [ -n "${{ inputs.desde }}" ]; then ARGS="$ARGS --desde ${{ inputs.desde }}"; fi
          python generador.py $ARGS
      - name: Enviar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EUCLIDIAN_REMITENTE: ${{ secrets.EUCLIDIAN_REMITENTE }}
          EUCLIDIAN_BASE_URL: ${{ secrets.EUCLIDIAN_BASE_URL }}
        run: |
          cd scripts
          case "${{ inputs.accion }}" in
            prueba)
              if [ -z "${{ inputs.correo_prueba }}" ]; then echo "Falta el correo de prueba."; exit 1; fi
              python enviador.py --prueba "${{ inputs.correo_prueba }}" ;;
            enviar) python enviador.py --confirmar ;;
            *) python enviador.py ;;
          esac
