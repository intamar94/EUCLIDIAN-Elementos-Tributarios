name: Inspector documental EUCLIDIAN

on:
  push:
    paths:
      - 'scripts/inspector_euclidian.py'
      - '.github/workflows/inspector_euclidian.yml'
  schedule:
    - cron: '25 15 * * *'
  workflow_dispatch:

concurrency:
  group: inspector-documental
  cancel-in-progress: false

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Inspeccionar todo el registro y casos DIAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/inspector_euclidian.py --enlaces 500
