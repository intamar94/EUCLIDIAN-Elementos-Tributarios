name: EUCLIDIAN — Revisor Fiscal

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Documentos a revisar por ejecución (hasta 20000)'
        required: false
        default: '20000'
      workers:
        description: 'Verificaciones concurrentes (1-32)'
        required: false
        default: '16'

permissions:
  contents: read

concurrency:
  group: euclidian-revisor-fiscal
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Pruebas del revisor fiscal
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ejecutar revisión fiscal turbo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/revisor_fiscal_euclidian.py --limit ${{ inputs.limite || '20000' }} --workers ${{ inputs.workers || '16' }}

# El revisor debe recorrer todo el corpus; cada ejecución continúa donde quedó.
