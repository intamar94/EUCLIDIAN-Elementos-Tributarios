name: LEGAL.ia publication gate
on:
  pull_request:
    paths:
      - 'LEGALIA/**'
      - 'scripts/legal-ia-gate.mjs'
      - 'index.html'
      - 'impressum.html'
      - 'datenschutz.html'
      - '.github/workflows/legalia-compliance.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  compliance:
    name: LEGAL.ia release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only audit
        run: node scripts/legal-ia-gate.mjs --mode audit
      - name: Block release unless human-reviewed
        run: node scripts/legal-ia-gate.mjs --mode release
