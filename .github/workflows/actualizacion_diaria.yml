name: Actualización automática DIAN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actualizacion_diaria.yml'
      - 'scripts/registrar_actualizacion.py'
      - 'scripts/scraper.py'
      - 'scripts/sincronizador_dian.py'
      - 'scripts/boletines_dian.py'
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: read

concurrency:
  group: euclidian-actualizacion-dian
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Registrar inicio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/registrar_actualizacion.py --estado iniciado --run-id "${{ github.run_id }}"

      - name: Validar fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py

      - name: Capturar cambios recientes del Normograma
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/scraper.py

      - name: Sincronizar Novedades Jurídicas DIAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/sincronizador_dian.py

      - name: Sincronizar boletines oficiales DIAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/boletines_dian.py

      - name: Descubrir fuentes históricas oficiales
        run: python scripts/descubrimiento_fuentes.py --limite 1000

      - name: Actualizar catálogo histórico local
        run: python scripts/actualizacion_diaria.py

      - name: Enriquecer fechas y contenido oficial en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/enriquecedor_fechas_v2.py --limite 500

      - name: Retirar fechas imposibles del catálogo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/quarantine_future_dates.py

      - name: Exportar índice consultable
        run: python scripts/catalogo_historico.py --entrada descubrimiento_fuentes.json --salida historico_index.json

      - name: Publicar artefactos del histórico
        uses: actions/upload-artifact@v4
        with:
          name: euclidian-historico-${{ github.run_id }}
          path: |
            historico_index.json
            descubrimiento_fuentes.json

      - name: Registrar éxito
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/registrar_actualizacion.py --estado exitoso --run-id "${{ github.run_id }}"

      - name: Registrar fallo
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/registrar_actualizacion.py --estado error --run-id "${{ github.run_id }}" --mensaje "La actualización automática DIAN falló. Revisar GitHub Actions."
