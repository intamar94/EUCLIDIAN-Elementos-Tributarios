name: EUCLIDIAN — Agente de integridad documental

on:
  push:
    branches: [main]
    paths:
      - 'scripts/agente_control_interno.py'
      - 'sql/agente_control_interno.sql'
      - 'api/inspector.js'
      - 'inspector.html'
      - 'inspector.js'
      - '.github/workflows/agente_control_interno.yml'
  workflow_run:
    workflows: ["Inspector documental EUCLIDIAN"]
    types: [completed]
  workflow_dispatch:
    inputs:
      modo:
        description: "Ejecutar o simular"
        required: true
        default: "aplicar"
        type: choice
        options: ["aplicar", "simular"]

permissions:
  contents: read

concurrency:
  group: euclidian-agente-integridad
  cancel-in-progress: false

jobs:
  gestionar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Gestionar hallazgos de la última inspección completa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INPUT_MODO: ${{ inputs.modo || 'aplicar' }}
        run: |
          if [ "$INPUT_MODO" = "simular" ]; then
            python scripts/agente_control_interno.py --dry-run
          else
            python scripts/agente_control_interno.py
          fi
