name: Control de calidad

concurrency:
  group: control-calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'api/**'
      - 'index.html'
      - 'app.html'
      - 'landing.css'
      - 'bandeja.js'
      - 'auth.js'
      - 'lib/**'
      - 'bloques.js'
      - 'fichas.js'
      - 'temas.js'
      - 'estilo.css'
      - 'fichas.css'
      - 'bloques.css'
      - 'detalle.css'
      - 'consulta.css'
      - '.github/workflows/control_calidad.yml'
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Documentos a auditar (vacío = todo el universo)'
        required: false
        default: '1000'
      aplicar:
        description: 'Escribir decisiones de aprobación/revisión en Supabase'
        required: false
        type: boolean
        default: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Verificar sintaxis de todos los scripts Python
        run: python -m compileall -q scripts
      - name: Verificar sintaxis JavaScript de interfaz y Auth
        run: |
          node --check bandeja.js
          node --check auth.js
          node --check bloques.js
          node --check api/auth.js
          node --check api/session.js
          node --check api/documentos.js
          node --check lib/auth-server.js
      - name: Verificar contrato E2E de consulta trazable
        run: node tests/e2e_consulta_contract.mjs
      - name: Contrato determinista de Auth y entitlement
        run: node tests/auth_flow_contract.mjs
      - name: Contrato de idempotencia de pagos
        run: node tests/payment_events_contract.mjs
      - name: Regresión comercial y ownership
        run: node tests/commercial_access_contract.mjs
      - name: Eval de consultas contra datos reales
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tests/eval_consulta_datos.mjs
      - name: Ejecutar handler real de consulta contra Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tests/e2e_documentos_handler.mjs
      - name: Verificar contrato determinista de alta confianza
        run: |
          cd scripts
          python - <<'PY'
          import test_quality_contract as t
          tests = [
              t.test_fuente_permitida_solo_https_normograma,
              t.test_resumen_sin_evidencia_no_se_aprueba,
              t.test_resumen_con_dato_numerico_no_presente_falla,
              t.test_resumen_vacio_no_se_aprueba,
          ]
          for test in tests:
              test()
              print('OK', test.__name__)
          print(f'Contrato de calidad: {len(tests)} pruebas OK')
          PY
      - name: Verificar verificador v2
        run: |
          cd scripts
          python test_verificador_aprobacion_v2.py
      - name: Verificar normalizador y cola resiliente
        run: |
          cd scripts
          python test_normalizador_juridico.py
          python test_cola_reprocesamiento.py
      - name: Verificar las dos fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py
      - name: Reparar dato oficial conocido
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/reparar_dato_oficial.py
      - name: Reparar fechas sospechosas con evidencia DIAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/reparar_fechas_oficiales.py
      - name: Poner en cuarentena fechas futuras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/quarantine_future_dates.py
      - name: Auditar universo documental
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          LIMIT='${{ inputs.limite || '1000' }}'
          APPLY='${{ inputs.aplicar || 'false' }}'
          if [ "$APPLY" = "true" ]; then
            python verificador_aprobacion.py --apply --limite "$LIMIT"
          else
            python verificador_aprobacion.py --limite "$LIMIT"
          fi
      - name: Control final de fuentes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/control_calidad.py --enlaces 100 --estricto
