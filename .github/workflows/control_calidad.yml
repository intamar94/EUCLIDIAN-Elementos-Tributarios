name: Control de calidad

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/control_calidad.yml'
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Documentos a auditar (vacío = todo el universo)'
        required: false
        default: '1000'
      aplicar:
        description: 'Escribir decisiones de aprobación/revisión en Supabase'
        required: false
        type: boolean
        default: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Verificar sintaxis de todos los scripts Python
        run: python -m compileall -q scripts
      - name: Verificar contrato determinista de alta confianza
        run: |
          cd scripts
          python - <<'PY'
          import test_quality_contract as t
          tests = [
              t.test_fuente_permitida_solo_https_normograma,
              t.test_resumen_sin_evidencia_no_se_aprueba,
              t.test_resumen_con_dato_numerico_no_presente_falla,
              t.test_resumen_vacio_no_se_aprueba,
          ]
          for test in tests:
              test()
              print('OK', test.__name__)
          print(f'Contrato de calidad: {len(tests)} pruebas OK')
          PY
      - name: Verificar verificador v2
        run: |
          cd scripts
          python test_verificador_aprobacion_v2.py
      - name: Verificar normalizador y cola resiliente
        run: |
          cd scripts
          python test_normalizador_juridico.py
          python test_cola_reprocesamiento.py
      - name: Verificar las dos fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py
      - name: Reparar dato oficial conocido
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/reparar_dato_oficial.py
      - name: Reparar fechas sospechosas con evidencia DIAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/reparar_fechas_oficiales.py
      - name: Poner en cuarentena fechas futuras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/quarantine_future_dates.py
      - name: Auditar universo documental
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          LIMIT='${{ inputs.limite || '1000' }}'
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            APPLY='true'
          else
            APPLY='${{ inputs.aplicar || 'false' }}'
          fi
          echo "Modo de auditoría: APPLY=$APPLY LIMIT=$LIMIT EVENT=${{ github.event_name }}"
          if [ "$APPLY" = "true" ]; then
            python verificador_aprobacion.py --apply --limite "$LIMIT"
          else
            python verificador_aprobacion.py --limite "$LIMIT"
          fi
      - name: Control final de fuentes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/control_calidad.py --enlaces 25 --estricto
