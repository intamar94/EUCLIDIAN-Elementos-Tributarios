name: Control de calidad

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/control_calidad.yml'
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      enlaces:
        description: 'Cuantos enlaces probar'
        required: false
        default: '25'

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Verificar sintaxis de todos los scripts Python
        run: python -m compileall -q scripts
      - name: Verificar contrato determinista de alta confianza
        run: |
          cd scripts
          python - <<'PY'
          import test_quality_contract as t
          tests = [
              t.test_fuente_permitida_solo_https_normograma,
              t.test_resumen_sin_evidencia_no_se_aprueba,
              t.test_resumen_con_dato_numerico_no_presente_falla,
              t.test_resumen_vacio_no_se_aprueba,
          ]
          for test in tests:
              test()
              print('OK', test.__name__)
          print(f'Contrato de calidad: {len(tests)} pruebas OK')
          PY
      - name: Verificar las dos fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py
      - name: Verificar y aprobar automáticamente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          python verificador_aprobacion.py --auto-aprobar --limite 300
      - name: Control final estricto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          python control_calidad.py --enlaces ${{ inputs.enlaces || '25' }} --estricto
