name: Control de calidad

concurrency:
  group: control-calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'api/**'
      - 'index.html'
      - 'app.html'
      - 'landing.css'
      - 'identidad-publica.css'
      - 'identidad-euclidian.css'
      - 'heroes-euclidian-responsive.css'
      - 'animaciones-euclidian.css'
      - 'estandar-heroes-euclidian.css'
      - 'animaciones-euclidian.js'
      - 'assets/**'
      - 'hero-publico-responsive.css'
      - 'icono-euclidian.svg'
      - 'geometria-euclidian.svg'
      - 'bandeja.js'
      - 'portada.js'
      - 'auth.js'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sql/**'
      - 'bloques.js'
      - 'practico.js'
      - 'practico.css'
      - 'fichas.js'
      - 'temas.js'
      - 'estilo.css'
      - 'fichas.css'
      - 'bloques.css'
      - 'detalle.css'
      - 'consulta.css'
      - '.github/workflows/control_calidad.yml'
  pull_request:
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          pip install -r scripts/requirements.txt
          npm ci
      - name: Verificar sintaxis de todos los scripts Python
        run: python -m compileall -q scripts
      - name: Verificar sintaxis JavaScript de interfaz y Auth
        run: |
          node --check bandeja.js
          node --check portada.js
          node --check auth.js
          node --check bloques.js
          node --check practico.js
          node --check api/auth.js
          node --check api/session.js
          node --check api/documentos.js
          node --check lib/auth-server.js
      - name: Contrato ficha práctica y borradores seguros
        run: node tests/ficha_practica_contract.mjs
      - name: Verificar contrato E2E de consulta trazable
        run: |
          node tests/e2e_consulta_contract.mjs
          node tests/extracto_literal_contract.mjs
          node tests/catalogo_resiliencia_contract.mjs
          node tests/novedades_resumen_contract.mjs
          node tests/retired_routes_contract.mjs
      - name: Contrato determinista de Auth y entitlement
        run: |
          node tests/auth_flow_contract.mjs
          node tests/browser_session_contract.mjs
      - name: Contrato de idempotencia de pagos
        run: |
          node tests/payment_events_contract.mjs
          node tests/billing_flow_contract.mjs
      - name: Verificar información legal de EUCLIDIANET
        run: |
          node --check lib/legal-public.js
          node --check api/impressum.js
          node --check api/datenschutz.js
          node tests/legal_public_contract.mjs
          node tests/signup_closed_contract.mjs
      - name: Regresiones Python de fuente y fechas
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Regresión comercial y ownership
        run: node tests/commercial_access_contract.mjs
      - name: Contrato portada pública y SEO
        run: node tests/public_landing_contract.mjs
      - name: "Auditoría focalizada: accesibilidad, fechas y SEO"
        run: node tests/auditoria_integral_contract.mjs
      - name: "Auditoría real de navegador: portada, ingreso y recorridos"
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROMIUM_PATH" ]; then npx playwright install --with-deps chromium; fi
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/euclidian-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          node tests/ui_public_audit_browser.cjs
          node tests/ui_onboarding_browser.cjs
      - name: Contrato identidad visual editorial
        run: node tests/identidad_visual_contract.mjs
      - name: Contrato heroes adaptativos y tamaños de escenas
        run: node tests/heroes_responsive_contract.mjs
      - name: Contrato de imágenes y vídeo HD
        run: node tests/hd_assets_contract.mjs
      - name: Contrato de seis heroes uniformes
        run: node tests/estandar_heroes_contract.mjs
      - name: Contrato readiness y observabilidad
        run: node tests/health_readiness_contract.mjs
      - name: Eval de consultas contra datos reales
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tests/eval_consulta_datos.mjs
      - name: Ejecutar handler real de consulta contra Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tests/e2e_documentos_handler.mjs
      - name: Verificar contrato determinista de alta confianza
        run: |
          cd scripts
          python - <<'PY'
          import test_quality_contract as t
          tests = [
              t.test_fuente_permitida_solo_https_normograma,
              t.test_resumen_sin_evidencia_no_se_aprueba,
              t.test_resumen_con_dato_numerico_no_presente_falla,
              t.test_resumen_vacio_no_se_aprueba,
          ]
          for test in tests:
              test()
              print('OK', test.__name__)
          print(f'Contrato de calidad: {len(tests)} pruebas OK')
          PY
      - name: Verificar verificador v2
        run: |
          cd scripts
          python test_verificador_aprobacion_v2.py
      - name: Verificar normalizador y cola resiliente
        run: |
          cd scripts
          python test_normalizador_juridico.py
          python test_cola_reprocesamiento.py
