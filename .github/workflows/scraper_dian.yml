name: Scraper DIAN

on:
  # Diario a las 6:00 Colombia (11:00 UTC).
  schedule:
    - cron: '0 11 * * *'
  # Ejecuta una vez al incorporar el lanzador basado en las fuentes oficiales.
  push:
    paths:
      - 'scripts/scraper_fuentes_dian.py'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - historico
          - dry-run

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Validar fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py

      - name: Ejecutar scraper desde fuentes descubiertas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          case "${{ inputs.modo || 'incremental' }}" in
            historico)  python scraper_fuentes_dian.py --historico ;;
            dry-run)    python scraper_fuentes_dian.py --dry-run ;;
            *)          python scraper_fuentes_dian.py ;;
          esac
