name: Scraper DIAN

on:
  # Diario a las 6:00 Colombia (11:00 UTC).
  #
  # Antes era '0 11 */3 * *', porque "*/3" no significa "cada 3 dias"
  # sino los dias del mes divisibles entre 3. Al cambiar de mes el
  # intervalo se rompe y GitHub puede ademas omitir ejecuciones con carga.
  # La consulta incremental diaria mantiene la base actualizada.
  schedule:
    - cron: '0 11 * * *'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - historico
          - dry-run

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Ejecutar scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          case "${{ inputs.modo || 'incremental' }}" in
            historico)  python scraper.py --historico ;;
            dry-run)    python scraper.py --dry-run ;;
            *)          python scraper.py ;;
          esac
