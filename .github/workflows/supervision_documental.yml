name: EUCLIDIAN — Recuperación documental
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_run:
    workflows: ['EUCLIDIAN — Ciclo documental']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: euclidian-supervision-documental
  cancel-in-progress: false
jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Comprobar latido y solicitar recuperación si corresponde
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/supervision_documental.py
