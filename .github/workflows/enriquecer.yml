name: Enriquecer documentos

on:
  # Diario a las 7:00 Colombia (12:00 UTC), una hora despues del scraper.
  # Tambien se ejecuta al actualizar este workflow para que las reparaciones
  # de datos no tengan que esperar al siguiente ciclo diario.
  schedule:
    - cron: '0 12 * * *'
  push:
    paths:
      - 'scripts/enriquecedor_fechas.py'
      - 'scripts/validar_fuentes_dian.py'
      - '.github/workflows/enriquecer.yml'

  workflow_dispatch:
    inputs:
      limite:
        description: 'Cuantos documentos abrir'
        required: false
        default: '500'
      anio:
        description: 'Solo un año (vacio = todos, mas recientes primero)'
        required: false
        default: ''
      dry_run:
        description: 'Solo mostrar, sin guardar'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'si']

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Validar fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py

      - name: Reparar y enriquecer fechas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          ARGS="--limite ${{ inputs.limite || '500' }}"
          if [ -n "${{ inputs.anio }}" ]; then ARGS="$ARGS --anio ${{ inputs.anio }}"; fi
          if [ "${{ inputs.dry_run }}" = "si" ]; then ARGS="$ARGS --dry-run"; fi
          python enriquecedor_fechas.py $ARGS
