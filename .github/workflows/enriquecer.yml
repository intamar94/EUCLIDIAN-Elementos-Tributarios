name: Enriquecer documentos

on:
  # Todos los dias a las 7:00 Colombia (12:00 UTC), una hora despues
  # del scraper. Va comiendo la cola de a poco para no golpear el sitio.
  schedule:
    - cron: '0 12 * * *'

  workflow_dispatch:
    inputs:
      limite:
        description: 'Cuantos documentos abrir'
        required: false
        default: '150'
      anio:
        description: 'Solo un año (vacio = todos, mas recientes primero)'
        required: false
        default: ''
      dry_run:
        description: 'Solo mostrar, sin guardar'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'si']

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Enriquecer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          ARGS="--limite ${{ inputs.limite || '150' }}"
          if [ -n "${{ inputs.anio }}" ]; then ARGS="$ARGS --anio ${{ inputs.anio }}"; fi
          if [ "${{ inputs.dry_run }}" = "si" ]; then ARGS="$ARGS --dry-run"; fi
          python enriquecedor.py $ARGS
