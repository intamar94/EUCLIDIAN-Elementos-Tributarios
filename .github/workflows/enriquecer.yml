name: Enriquecer documentos

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      anio:
        description: 'Solo un año (vacio = los mas recientes primero)'
        required: false
        default: ''
      limite:
        description: 'Cuantos documentos como maximo'
        required: false
        default: '400'
      dry_run:
        description: 'Mostrar sin guardar'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'si']

concurrency:
  group: euclidian-enriquecimiento
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Validar las dos fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py

      - name: Reparar y enriquecer documentos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          ARGS="--limite ${{ inputs.limite || '400' }}"
          if [ -n "${{ inputs.anio }}" ]; then ARGS="$ARGS --anio ${{ inputs.anio }}"; fi
          if [ "${{ inputs.dry_run }}" = "si" ]; then ARGS="$ARGS --dry-run"; fi
          python enriquecedor_fechas_v2.py $ARGS
