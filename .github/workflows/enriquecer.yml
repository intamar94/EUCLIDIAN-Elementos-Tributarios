name: Enriquecer documentos

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      anio:
        description: 'Solo un año (vacio = los mas recientes primero)'
        required: false
        default: ''
      limite:
        description: 'Cuantos documentos como maximo'
        required: false
        default: '1000'
      dry_run:
        description: 'Mostrar sin guardar'
        required: false
        default: 'si'
        type: choice
        options: ['si', 'no']

concurrency:
  group: euclidian-enriquecimiento
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Validar las dos fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py

      - name: Reparar y enriquecer documentos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          ARGS="--limite ${{ inputs.limite || '1000' }}"
          if [ -n "${{ inputs.anio }}" ]; then ARGS="$ARGS --anio ${{ inputs.anio }}"; fi
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.dry_run || 'si' }}" = "si" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/enriquecedor_fechas_v2.py $ARGS 2>&1 | tee enriquecimiento.log

      - name: Procesar lote con verificación de alta confianza
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == 'no' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python scripts/procesar_lote_seguro.py --apply --limite "${{ inputs.limite || '1000' }}" 2>&1 | tee lote_seguro.log

      - name: Auditoría sin escritura
        if: ${{ github.event_name != 'schedule' && inputs.dry_run != 'no' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python scripts/procesar_lote_seguro.py --limite "${{ inputs.limite || '1000' }}" 2>&1 | tee lote_seguro.log

      - name: Control de calidad final
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python scripts/control_calidad.py --enlaces 25 --estricto 2>&1 | tee calidad.log

      - name: Generar informe de progreso
        if: always()
        run: |
          {
            echo "## EUCLIDIAN — Progreso y calidad"
            echo
            echo "### Ejecución"
            echo "- Límite: ${{ inputs.limite || '1000' }}"
            echo "- Año: ${{ inputs.anio || 'más recientes primero' }}"
            echo "- Evento: ${{ github.event_name }}"
            echo "- Modo simulación: ${{ inputs.dry_run || 'automático en schedule' }}"
            echo
            echo "### Enriquecimiento"
            grep -E 'documentos seleccionados|RESUMEN_EUCLIDIAN|fecha_verificada|fecha_no_verificada|fecha_patron_sin_fecha_valida|fecha_sin_evidencia_en_pagina|enlace_404|error_red|error_guardado|actualizados' enriquecimiento.log || true
            echo
            echo "### Lote seguro"
            cat lote_seguro.log || true
            echo
            echo "### Control de calidad"
            cat calidad.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informes de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euclidian-calidad-${{ github.run_number }}
          path: |
            enriquecimiento.log
            lote_seguro.log
            calidad.log
          if-no-files-found: warn
          retention-days: 30
