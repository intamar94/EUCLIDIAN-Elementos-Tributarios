name: Enriquecer documentos

on:
  # Diario a las 7:00 Colombia (12:00 UTC), una hora despues del scraper.
  # Tambien se ejecuta al actualizar el reparador para que las correcciones
  # de datos no tengan que esperar al siguiente ciclo diario.
  schedule:
    - cron: '0 12 * * *'
  push:
    paths:
      - 'scripts/enriquecedor_fechas.py'
      - 'scripts/enriquecedor_fechas_v2.py'
      - 'scripts/validar_fuentes_dian.py'
      - '.github/workflows/enriquecer.yml'

  workflow_dispatch:
    inputs:
      lote:
        description: 'Documentos por lote'
        required: false
        default: '500'
      max_lotes:
        description: 'Maximo de lotes por ejecucion'
        required: false
        default: '50'
      anio:
        description: 'Solo un año (vacio = todos, mas recientes primero)'
        required: false
        default: ''
      dry_run:
        description: 'Solo mostrar, sin guardar'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'si']

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Validar fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py

      - name: Reparar y enriquecer todos los pendientes por lotes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          cd scripts
          LOTE='${{ inputs.lote || '500' }}'
          MAX_LOTES='${{ inputs.max_lotes || '50' }}'
          ANIO='${{ inputs.anio || '' }}'
          DRY='${{ inputs.dry_run || 'no' }}'

          for ((lote=1; lote<=MAX_LOTES; lote++)); do
            echo "============================================================"
            echo "LOTE ${lote}/${MAX_LOTES} — hasta ${LOTE} documentos"
            echo "============================================================"

            ARGS="--limite ${LOTE}"
            if [ -n "${ANIO}" ]; then ARGS="$ARGS --anio ${ANIO}"; fi
            if [ "${DRY}" = "si" ]; then ARGS="$ARGS --dry-run"; fi

            SALIDA=$(python enriquecedor_fechas_v2.py ${ARGS} 2>&1 | tee /dev/stderr) || {
              echo "ERROR: fallo el lote ${lote}. No se declara el proceso completo."
              exit 1
            }

            if echo "${SALIDA}" | grep -q "No hay documentos por enriquecer"; then
              echo "COMPLETADO: no quedan documentos pendientes."
              break
            fi

            if [ "${lote}" -eq "${MAX_LOTES}" ]; then
              echo "ERROR: se alcanzo MAX_LOTES=${MAX_LOTES}."
              echo "La base puede seguir teniendo documentos pendientes."
              exit 1
            fi
          done

      - name: Control final de calidad
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          python control_calidad.py --enlaces 25 --estricto
