name: Enriquecer documentos

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      anio:
        description: 'Solo un año (vacio = los mas recientes primero)'
        required: false
        default: ''
      limite:
        description: 'Cuantos documentos como maximo'
        required: false
        default: '400'
      dry_run:
        description: 'Mostrar sin guardar'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'si']

concurrency:
  group: euclidian-enriquecimiento
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Validar las dos fuentes oficiales DIAN
        run: python scripts/validar_fuentes_dian.py

      - name: Reparar y enriquecer documentos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          ARGS="--limite ${{ inputs.limite || '400' }}"
          if [ -n "${{ inputs.anio }}" ]; then ARGS="$ARGS --anio ${{ inputs.anio }}"; fi
          if [ "${{ inputs.dry_run }}" = "si" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/enriquecedor_fechas_v2.py $ARGS 2>&1 | tee enriquecimiento.log

      - name: Verificar evidencia y aptitud de datos aprobados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/verificador_evidencia.py --limite 1000 --strict | tee evidencia.log

      - name: Control de calidad final
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/control_calidad.py --enlaces 25 --estricto | tee calidad.log

      - name: Generar informe de progreso
        if: always()
        run: |
          {
            echo "## EUCLIDIAN — Progreso y calidad"
            echo
            echo "### Ejecución"
            echo "- Límite: ${{ inputs.limite || '400' }}"
            echo "- Año: ${{ inputs.anio || 'más recientes primero' }}"
            echo "- Modo simulación: ${{ inputs.dry_run || 'no' }}"
            echo
            echo "### Enriquecimiento"
            grep -E 'documentos seleccionados|RESUMEN_EUCLIDIAN|fecha_verificada|fecha_no_verificada|fecha_patron_sin_fecha_valida|fecha_sin_evidencia_en_pagina|enlace_404|error_red|error_guardado|actualizados' enriquecimiento.log || true
            echo
            echo "### Evidencia"
            cat evidencia.log || true
            echo
            echo "### Control de calidad"
            cat calidad.log || true
            echo
            echo "### Enlaces 404"
            grep 'ENLACE_404' enriquecimiento.log || echo "Ninguno"
            echo
            echo "### Documentos sin fecha verificable"
            grep 'fecha=NO VERIFICADA' enriquecimiento.log | tail -50 || echo "Ninguno"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informes de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euclidian-calidad-${{ github.run_number }}
          path: |
            enriquecimiento.log
            evidencia.log
            calidad.log
            evidencia_euclidian.json
          if-no-files-found: warn
          retention-days: 30
