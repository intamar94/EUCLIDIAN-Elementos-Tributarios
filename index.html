<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1E9">
<title>EUCLIDIAN · Bandeja de revisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/fichas.css">
<link rel="stylesheet" href="/bloques.css">
<style>
body{background:#f3f0e8}
#puerta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;box-sizing:border-box;background:repeating-linear-gradient(to bottom,#f4f1e9 0,#f4f1e9 31px,#e5e0d5 32px)}
#puerta[hidden]{display:none}
#puerta form{width:min(720px,100%);box-sizing:border-box;background:#fbfaf5;border:1px solid #ded8cb;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px rgba(61,54,42,.12);text-align:center;padding:0 48px 42px}
#puerta .ilustracion{display:block;width:calc(100% + 96px);height:auto;margin:0 -48px;border-bottom:2px solid #b83b2f;background:#f4f1e9}
#puerta .marca{font-family:Spectral,Georgia,serif;font-size:54px;letter-spacing:.03em;line-height:1;margin-top:30px;color:#202020}
#puerta .marca em{font-style:normal;color:#b83b2f}
#puerta .sub{font-family:'IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.28em;font-size:14px;color:#6c735f;margin-top:13px}
#puerta p{font-family:'IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:#777568;margin:42px 0 16px}
#puerta input{width:100%;height:58px;box-sizing:border-box;border:1px solid #c8c1b4;border-radius:10px;background:#fffdf8;padding:0 18px;font-family:'IBM Plex Sans',sans-serif;font-size:17px;color:#282723}
#puerta input:focus{outline:2px solid #b83b2f;outline-offset:2px}
#puerta button{width:100%;height:58px;margin-top:18px;border:0;border-radius:10px;background:#b83b2f;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
#puerta .mal{font-family:'IBM Plex Sans',sans-serif;color:#b83b2f;font-size:13px;margin-top:12px;min-height:18px}

#cab{display:block;background:#f3f0e8;padding:16px 0 0}
.banner-euclidian{width:min(1180px,calc(100% - 32px));margin:0 auto;background:#fbfaf5;border:1px solid #ded8cb;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(61,54,42,.08)}
.banner-marca{text-align:center;padding:16px 20px 14px;background:#f7f4ec}
.banner-marca .marca{font-family:Spectral,Georgia,serif;font-size:48px;letter-spacing:.03em;line-height:1;color:#202020}
.banner-marca .marca em{font-style:normal;color:#b83b2f}
.banner-marca .sub{font-family:'IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.25em;font-size:11px;color:#6c735f;margin-top:7px}
.banner-euclidian .ilustracion{display:block;width:100%;height:auto;margin:0;border-top:1px solid #ded8cb}
.cab-util{width:min(1180px,calc(100% - 32px));margin:13px auto 0;padding:0 2px 12px}
.fecha-actual{display:block;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.04em;color:#6c735f;text-transform:capitalize}
.cab-cifras,.cab-util .derecha{display:none}

#controles .filtros-directos{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 16px;border-top:2px solid #b83b2f}
#controles .filtros-directos .rotulo{margin:0;white-space:nowrap}
#controles .filtros-directos select{min-height:42px}
#controles .filtros-directos .limpiar{margin-left:4px}
#controles .mas{display:none}

@media(min-width:900px){
  #puerta form{width:min(860px,100%);padding:0 60px 52px}
  #puerta .ilustracion{width:calc(100% + 120px);margin:0 -60px}
  #puerta .marca{font-size:64px;margin-top:36px}
  #puerta .sub{font-size:15px}
  #puerta p{font-size:14px;margin:48px 0 18px}
  #puerta input,#puerta button{height:64px;font-size:18px}
  #cab{padding-top:22px}
  .banner-marca .marca{font-size:58px}
}
@media(max-width:620px){
  #puerta{padding:12px}
  #puerta form{padding:0 22px 28px;border-radius:16px}
  #puerta .ilustracion{width:calc(100% + 44px);margin:0 -22px}
  #puerta .marca{font-size:39px;margin-top:24px}
  #puerta .sub{font-size:11px;letter-spacing:.22em}
  #puerta p{margin-top:30px}
  #cab{padding-top:10px}
  .banner-euclidian,.cab-util{width:calc(100% - 20px)}
  .banner-euclidian{border-radius:14px}
  .banner-marca{padding:12px 10px 10px}
  .banner-marca .marca{font-size:36px}
  .banner-marca .sub{font-size:9px;letter-spacing:.18em}
  .banner-euclidian .ilustracion{height:auto}
  .cab-util{margin-top:10px;padding-bottom:10px}
  .fecha-actual{font-size:12px;letter-spacing:.02em}
  #controles .filtros-directos{display:grid;grid-template-columns:1fr;gap:12px;padding:12px 0 16px}
  #controles .filtro{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:8px}
  #controles .filtros-directos> .rotulo{display:none}
  #controles .filtros-directos> .filtro select{width:100%;min-height:48px}
}
</style>
</head>
<body>
<div id="puerta">
  <form onsubmit="entrar(event)">
    <img class="ilustracion" src="/euclides.png" alt="Euclides explicando la DIAN a sus discípulos" width="1400" height="770">
    <div class="marca">EUCL<em>i</em>DIAN</div>
    <div class="sub">Elementos Tributarios</div>
    <p>Clave de acceso</p>
    <input id="clave" type="password" autocomplete="current-password" required placeholder="Ingrese su contraseña">
    <button type="submit">Entrar</button>
    <div class="mal" id="mal"></div>
  </form>
</div>

<header hidden id="cab">
  <div class="banner-euclidian">
    <div class="banner-marca">
      <div class="marca">EUCL<em>i</em>DIAN</div>
      <div class="sub">Elementos Tributarios · Bandeja de revisión</div>
    </div>
    <img class="ilustracion" src="/euclides.png" alt="Euclides explicando la DIAN a sus discípulos" width="1400" height="770">
  </div>
  <div class="cab-util"><span class="fecha-actual" id="fechaActual"></span></div>
</header>

<div class="controles marco" hidden id="controles">
  <div class="filtros-directos">
    <div class="filtro"><span class="rotulo">Año</span><select id="selAnio" aria-label="Elegir año"><option value="">Cualquier año</option></select></div>
    <div class="filtro"><span class="rotulo">Sobre qué trata</span><select id="selTema" aria-label="Elegir tema"><option value="">Todos los temas</option></select></div>
    <button class="limpiar" id="btnLimpiar" hidden onclick="limpiar()">Quitar filtros</button>
    <div hidden id="gPrioridad"></div><div hidden id="gNaturaleza"></div><div hidden id="gEstado"></div><div hidden id="gPeriodo"></div><i hidden id="activos"></i>
  </div>
</div>

<div class="barra marco" hidden id="barra"><span id="rango"></span><label>Ordenar <select id="selOrden"><option value="recientes">Lo más reciente</option><option value="prioridad">Lo más urgente</option><option value="antiguos">Lo más antiguo</option></select></label></div>
<main class="marco" id="lista"></main>
<div class="paginas marco" id="paginas"></div>

<script>
(function(){
  const sel=document.getElementById('selAnio');
  const y=new Date().getFullYear();
  sel.innerHTML='<option value="">Cualquier año</option>';
  for(let a=y;a>=1931;a--){const o=document.createElement('option');o.value=String(a);o.textContent=String(a);sel.appendChild(o)}
  const actualizar=()=>{const d=new Date();const f=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const hora=new Intl.DateTimeFormat('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);document.getElementById('fechaActual').textContent=f.format(d)+' · '+hora};
  actualizar(); setInterval(actualizar,60000);
})();
</script>
<script src="/temas.js" defer></script>
<script src="/fichas.js" defer></script>
<script src="/bloques.js" defer></script>
<script src="/bandeja.js" defer></script>
</body>
</html>
