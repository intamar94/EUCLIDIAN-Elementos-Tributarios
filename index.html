<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1E9">
<title>EUCLIDIAN · Bandeja de revisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/fichas.css">
<link rel="stylesheet" href="/bloques.css">
<style>
body{background:#f3f0e8}
#puerta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;box-sizing:border-box;background:repeating-linear-gradient(to bottom,#f4f1e9 0,#f4f1e9 31px,#e5e0d5 32px)}
#puerta[hidden]{display:none}
#puerta form{width:min(720px,100%);box-sizing:border-box;background:#fbfaf5;border:1px solid #ded8cb;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px rgba(61,54,42,.12);text-align:center;padding:0 48px 42px}
#puerta .ilustracion{display:block;width:calc(100% + 96px);height:auto;max-height:360px;object-fit:cover;margin:0 -48px;border-bottom:2px solid #b83b2f;background:#f4f1e9}
#puerta .marca{font-family:Spectral,Georgia,serif;font-size:54px;letter-spacing:.03em;line-height:1;margin-top:30px;color:#202020}
#puerta .marca em{font-style:normal;color:#b83b2f}
#puerta .sub{font-family:'IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.28em;font-size:14px;color:#6c735f;margin-top:13px}
#puerta p{font-family:'IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:#777568;margin:42px 0 16px}
#puerta input{width:100%;height:58px;box-sizing:border-box;border:1px solid #c8c1b4;border-radius:10px;background:#fffdf8;padding:0 18px;font-family:'IBM Plex Sans',sans-serif;font-size:17px;color:#282723;box-shadow:inset 0 1px 2px rgba(0,0,0,.03)}
#puerta input:focus{outline:2px solid #b83b2f;outline-offset:2px}
#puerta button{width:100%;height:58px;margin-top:18px;border:0;border-radius:10px;background:#b83b2f;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 12px rgba(120,40,30,.18)}
#puerta button:hover{background:#a93228}
#puerta .mal{font-family:'IBM Plex Sans',sans-serif;color:#b83b2f;font-size:13px;margin-top:12px;min-height:18px}
@media(min-width:900px){#puerta form{width:min(860px,100%);padding:0 60px 52px}#puerta .ilustracion{width:calc(100% + 120px);margin:0 -60px;max-height:440px}#puerta .marca{font-size:64px;margin-top:36px}#puerta .sub{font-size:15px}#puerta p{font-size:14px;margin:48px 0 18px}#puerta input,#puerta button{height:64px;font-size:18px}}
@media(max-width:620px){#puerta{padding:12px}#puerta form{padding:0 22px 28px;border-radius:16px}#puerta .ilustracion{width:calc(100% + 44px);margin:0 -22px;max-height:235px}#puerta .marca{font-size:39px;margin-top:24px}#puerta .sub{font-size:11px;letter-spacing:.22em}#puerta p{margin-top:30px}}
</style>
</head>
<body>
<div id="puerta">
  <form onsubmit="entrar(event)">
    <img class="ilustracion" src="/euclides.png" alt="Euclides explicando la DIAN a sus discípulos" width="1400" height="770">
    <div class="marca">EUCL<em>i</em>DIAN</div>
    <div class="sub">Elementos Tributarios</div>
    <p>Clave de acceso</p>
    <input id="clave" type="password" autocomplete="current-password" required placeholder="Ingrese su contraseña">
    <button type="submit">Entrar</button>
    <div class="mal" id="mal"></div>
  </form>
</div>
<header hidden id="cab">
  <div class="marco cab">
    <div><div class="marca">EUCL<em>i</em>DIAN</div><div class="sub">Bandeja de revisión</div></div>
    <div class="cifras"><div><b id="nPend">·</b><span>por revisar</span></div><div><b id="nApr">·</b><span>aprobados</span></div></div>
    <div class="derecha"><span class="sello" id="sello"></span><button class="recargar" id="btnRecargar" onclick="cargar()">Actualizar</button></div>
  </div>
</header>
<div class="controles marco" hidden id="controles">
  <div class="tiras" id="gPrioridad">
    <button data-v="" aria-pressed="true">Todas <b></b></button>
    <button class="pri-accion" data-v="accion" aria-pressed="false">Acción requerida <b></b></button>
    <button data-v="importante" aria-pressed="false">Importantes <b></b></button>
    <button data-v="informativa" aria-pressed="false">Informativas <b></b></button>
  </div>
  <details class="mas">
    <summary>Más filtros <i id="activos"></i></summary>
    <div class="panel">
      <div class="eje">
        <span class="rotulo">Qué clase de documento</span>
        <div class="tiras" id="gNaturaleza">
          <button data-v="" aria-pressed="true">Todos <b></b></button>
          <button data-v="obligatorias" aria-pressed="false">Obligatorias <b></b></button>
          <button data-v="conceptos" aria-pressed="false">Conceptos <b></b></button>
        </div>
      </div>
      <div class="eje">
        <span class="rotulo">Ya revisados</span>
        <div class="tiras" id="gEstado">
          <button data-v="pendientes" aria-pressed="true">Sin revisar <b></b></button>
          <button data-v="nuevos" aria-pressed="false">Novedades <b></b></button>
          <button data-v="aprobados" aria-pressed="false">Aprobados <b></b></button>
          <button data-v="todos" aria-pressed="false">Ver todo <b></b></button>
        </div>
      </div>
      <div class="eje">
        <span class="rotulo">De cuándo</span>
        <div class="tiras" id="gPeriodo">
          <button data-v="2026" aria-pressed="true">Este año <b></b></button>
          <button data-v="recientes" aria-pressed="false">Últimos 3 años <b></b></button>
          <button data-v="decada" aria-pressed="false">Última década <b></b></button>
          <button data-v="todo" aria-pressed="false">Todo el archivo <b></b></button>
        </div>
      </div>
      <div class="eje">
        <span class="rotulo">Año</span>
        <select id="selAnio" aria-label="Elegir año">
          <option value="">Cualquier año</option>
          <option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option><option value="2021">2021</option><option value="2020">2020</option><option value="2019">2019</option><option value="2018">2018</option><option value="2017">2017</option><option value="2016">2016</option><option value="2015">2015</option><option value="2014">2014</option><option value="2013">2013</option><option value="2012">2012</option><option value="2011">2011</option><option value="2010">2010</option><option value="2009">2009</option><option value="2008">2008</option><option value="2007">2007</option><option value="2006">2006</option><option value="2005">2005</option><option value="2004">2004</option><option value="2003">2003</option><option value="2002">2002</option><option value="2001">2001</option><option value="2000">2000</option><option value="1999">1999</option><option value="1998">1998</option><option value="1997">1997</option><option value="1996">1996</option><option value="1995">1995</option><option value="1994">1994</option><option value="1993">1993</option><option value="1992">1992</option><option value="1991">1991</option><option value="1990">1990</option><option value="1989">1989</option><option value="1988">1988</option><option value="1987">1987</option><option value="1986">1986</option><option value="1985">1985</option><option value="1984">1984</option><option value="1983">1983</option><option value="1982">1982</option><option value="1981">1981</option><option value="1980">1980</option><option value="1979">1979</option><option value="1978">1978</option><option value="1977">1977</option><option value="1976">1976</option><option value="1975">1975</option><option value="1974">1974</option><option value="1973">1973</option><option value="1972">1972</option><option value="1971">1971</option><option value="1970">1970</option><option value="1969">1969</option><option value="1968">1968</option><option value="1967">1967</option><option value="1966">1966</option><option value="1965">1965</option><option value="1964">1964</option><option value="1963">1963</option><option value="1962">1962</option><option value="1961">1961</option><option value="1960">1960</option><option value="1959">1959</option><option value="1958">1958</option><option value="1957">1957</option><option value="1956">1956</option><option value="1955">1955</option><option value="1954">1954</option><option value="1953">1953</option><option value="1952">1952</option><option value="1951">1951</option><option value="1950">1950</option><option value="1949">1949</option><option value="1948">1948</option><option value="1947">1947</option><option value="1946">1946</option><option value="1945">1945</option><option value="1944">1944</option><option value="1943">1943</option><option value="1942">1942</option><option value="1941">1941</option><option value="1940">1940</option><option value="1939">1939</option><option value="1938">1938</option><option value="1937">1937</option><option value="1936">1936</option><option value="1935">1935</option><option value="1934">1934</option><option value="1933">1933</option><option value="1932">1932</option><option value="1931">1931</option>
        </select>
      </div>
      <div class="eje"><span class="rotulo">Sobre qué trata</span><select id="selTema"><option value="">Cualquier tema</option></select></div>
      <button class="limpiar" id="btnLimpiar" hidden onclick="limpiar()">Quitar filtros</button>
    </div>
  </details>
</div>
<div class="barra marco" hidden id="barra"><span id="rango"></span><label>Ordenar <select id="selOrden"><option value="recientes">Lo más reciente</option><option value="prioridad">Lo más urgente</option><option value="antiguos">Lo más antiguo</option></select></label></div>
<main class="marco" id="lista"></main>
<div class="paginas marco" id="paginas"></div>
<script src="/temas.js" defer></script>
<script src="/fichas.js" defer></script>
<script src="/bloques.js" defer></script>
<script src="/bandeja.js" defer></script>
</body>
</html>
