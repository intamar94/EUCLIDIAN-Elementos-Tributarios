<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1E9">
<title>EUCLIDIAN · Bandeja de revisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/fichas.css">
</head>
<body>

<div id="puerta">
  <form onsubmit="entrar(event)">
    <div class="marca">EUCL<em>i</em>DIAN</div>
    <div class="sub">Elementos Tributarios</div>
    <p>Clave de acceso</p>
    <input id="clave" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="mal" id="mal"></div>
  </form>
</div>

<header hidden id="cab">
  <div class="marco cab">
    <div>
      <div class="marca">EUCL<em>i</em>DIAN</div>
      <div class="sub">Bandeja de revisión</div>
    </div>
    <div class="cifras">
      <div><b id="nPend">·</b><span>por revisar</span></div>
      <div><b id="nApr">·</b><span>aprobados</span></div>
    </div>
    <div class="derecha">
      <span class="sello" id="sello"></span>
      <button class="recargar" id="btnRecargar" onclick="cargar()">Actualizar</button>
    </div>
  </div>
</header>

<div class="controles marco" hidden id="controles">
  <!-- Lo primero y unico siempre visible: por donde empieza el trabajo.
       El resto se despliega solo si hace falta. Antes los tres grupos
       ocupaban la pantalla entera antes de mostrar un documento. -->
  <div class="grupo tiras" id="gPrioridad">
    <button data-v="" aria-pressed="true">Todas <b></b></button>
    <button class="pri-accion" data-v="accion" aria-pressed="false">Acción requerida <b></b></button>
    <button class="pri-importante" data-v="importante" aria-pressed="false">Importantes <b></b></button>
    <button data-v="informativa" aria-pressed="false">Informativas <b></b></button>
  </div>

  <details class="mas">
    <summary>Más filtros</summary>
    <div class="grupo tiras" id="gEstado">
      <button data-v="pendientes" aria-pressed="true">Por revisar <b></b></button>
      <button data-v="obligatorias" aria-pressed="false">Obligatorias <b></b></button>
      <button data-v="urgentes" aria-pressed="false">Plazo o retroactivas <b></b></button>
      <button data-v="conceptos" aria-pressed="false">Conceptos <b></b></button>
      <button data-v="aprobados" aria-pressed="false">Aprobados <b></b></button>
    </div>
    <div class="selectores">
      <select id="selTema" aria-label="Filtrar por tema">
        <option value="">Todos los temas</option>
      </select>
      <select id="selOrden" aria-label="Ordenar">
        <option value="recientes">Más recientes primero</option>
        <option value="prioridad">Lo urgente primero</option>
        <option value="antiguos">Más antiguos primero</option>
      </select>
    </div>
  </details>
</div>

<main class="marco" id="lista"></main>
<div class="paginas marco" id="paginas"></div>

<script src="/fichas.js" defer></script>
<script src="/bandeja.js" defer></script>
</body>
</html>
