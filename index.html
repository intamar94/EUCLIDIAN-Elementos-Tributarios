<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1E9">
<title>EUCLIDIAN · Bandeja de revisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#EDF1E9;      /* papel de libro contable */
  --ficha:#FAFBF8;
  --tinta:#17211C;
  --tenue:#5E6B62;
  --regla:#B23A32;      /* rojo de renglón */
  --azul:#2C4C8F;       /* Byrne */
  --ocre:#C99A2E;       /* Byrne */
  --linea:#D2DACB;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  /* renglones del libro contable */
  background-image:linear-gradient(var(--linea) 1px,transparent 1px);
  background-size:100% 34px;
}

/* ---------- cabecera ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--papel);
  border-bottom:2px solid var(--regla);
  padding:14px 18px 10px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.marca{
  font-family:'Spectral',Georgia,serif;
  font-size:19px;font-weight:600;letter-spacing:.06em;
}
.marca em{font-style:normal;color:var(--regla)}
.sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tenue);margin-top:3px;
}
.cuenta{
  display:flex;gap:22px;margin-top:11px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;
}
.cuenta b{font-size:17px;font-weight:500;display:block;line-height:1.15}
.cuenta span{color:var(--tenue);letter-spacing:.06em}

/* ---------- filtros ---------- */
nav{display:flex;gap:7px;padding:12px 18px 4px;flex-wrap:wrap}
nav button{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase;
  padding:6px 12px;border:1px solid var(--linea);
  background:transparent;color:var(--tenue);
  border-radius:2px;cursor:pointer;
}
nav button[aria-pressed="true"]{
  background:var(--tinta);color:var(--papel);border-color:var(--tinta);
}
nav button:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
nav button b{
  font-weight:500;opacity:.65;margin-left:4px;
}
nav button[aria-pressed="true"] b{opacity:.8}

#temas{
  display:flex;align-items:center;gap:8px;
  padding:8px 18px 0;
}
#temas label{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);
}
#temas select{
  flex:1;padding:6px 9px;border:1px solid var(--linea);
  background:var(--ficha);color:var(--tinta);border-radius:2px;
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;
}
#temas select:focus{outline:2px solid var(--azul);outline-offset:1px}
#temas[hidden]{display:none}

/* ---------- ficha ---------- */
main{padding:10px 18px 40px;display:flex;flex-direction:column;gap:14px}
article{
  background:var(--ficha);
  border:1px solid var(--linea);
  border-left:3px solid var(--regla);
  padding:15px 16px 13px;
  animation:entra .22s ease-out both;
}
@keyframes entra{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){article{animation:none}}

.fila-id{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.glifo{flex:none}
.codigo{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.04em;color:var(--tenue);
  text-decoration:none;border-bottom:1px solid var(--linea);
}
.codigo:hover,.codigo:focus-visible{color:var(--azul);border-color:var(--azul)}
.fecha{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:var(--tenue);margin-left:auto;white-space:nowrap;
}

h2{
  font-family:'Spectral',Georgia,serif;
  font-size:16.5px;font-weight:600;line-height:1.3;margin-bottom:7px;
}
.dice{
  font-family:'Spectral',Georgia,serif;
  font-size:15px;line-height:1.55;color:#28332C;
}
.fuente{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:4px;
}

.marcas{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.marcas span{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.05em;padding:3px 7px;border:1px solid var(--linea);
  color:var(--tenue);border-radius:2px;
}
.marcas .fuerte{border-color:var(--azul);color:var(--azul)}
.marcas .alerta{border-color:var(--regla);color:var(--regla)}
.marcas .materia{
  background:var(--tinta);color:var(--papel);border-color:var(--tinta);
  letter-spacing:.08em;text-transform:uppercase;font-size:9px;
}

/* ---------- editor del resumen humano ---------- */
.escribir{
  margin-top:13px;padding-top:13px;border-top:1px dashed var(--linea);
}
.escribir label{
  display:block;font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:5px;
}
.escribir textarea{
  width:100%;min-height:74px;resize:vertical;
  padding:10px 11px;border:1px solid var(--linea);
  background:#fff;color:var(--tinta);border-radius:2px;
  font-family:'Spectral',Georgia,serif;font-size:15px;line-height:1.5;
}
.escribir textarea:focus{outline:2px solid var(--azul);outline-offset:1px}
.escribir textarea::placeholder{color:#9AA79E;font-style:italic}
.pista{
  font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;
  color:var(--tenue);margin-top:5px;line-height:1.45;
}
.pista b{color:var(--tinta);font-weight:600}
.contador{float:right;font-family:'IBM Plex Mono',monospace;font-size:10.5px}
.contador.largo{color:var(--regla)}
.escrito{
  border-left-color:var(--azul) !important;
}
.borrador{
  margin-top:13px;padding:11px 12px;
  background:#F3F0E4;border-left:3px solid var(--ocre);border-radius:2px;
}
.borrador.baja{background:#FBEAE9;border-left-color:var(--regla)}
.borrador-cab{
  display:flex;align-items:center;gap:7px;margin-bottom:6px;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);
}
.confianza{
  padding:1px 6px;border:1px solid currentColor;border-radius:2px;
  font-size:9px;
}
.confianza.alta{color:#2F6B4F}
.confianza.media{color:var(--ocre)}
.confianza.baja{color:var(--regla)}
.borrador p{
  font-family:'Spectral',Georgia,serif;font-size:14.5px;
  line-height:1.5;color:#28332C;margin:0;
}
.borrador .ojo{
  margin-top:7px;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;
  color:var(--regla);line-height:1.45;
}
.usar{
  margin-top:9px;width:100%;padding:8px;
  border:1px solid var(--tinta);background:transparent;color:var(--tinta);
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;
  border-radius:2px;cursor:pointer;
}
.usar:active{transform:translateY(1px)}
.sello{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--azul);
  margin-top:6px;
}

/* ---------- acciones ---------- */
.acciones{display:flex;gap:8px;margin-top:14px}
.acciones button{
  flex:1;font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;font-weight:500;padding:11px;
  border:1px solid var(--tinta);background:transparent;
  color:var(--tinta);border-radius:2px;cursor:pointer;
}
.acciones .si{background:var(--tinta);color:var(--papel)}
.acciones button:active{transform:translateY(1px)}
.acciones button:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* ---------- estados ---------- */
.aviso{
  padding:30px 20px;text-align:center;
  font-family:'Spectral',Georgia,serif;font-size:16px;color:var(--tenue);
}
.aviso b{display:block;font-size:19px;color:var(--tinta);margin-bottom:6px}
.error{border-left:3px solid var(--regla);background:var(--ficha);
  padding:15px 16px;font-size:14px}
.error code{font-family:'IBM Plex Mono',monospace;font-size:12px;
  display:block;margin-top:6px;color:var(--tenue);word-break:break-all}

/* ---------- puerta ---------- */
#puerta{
  position:fixed;inset:0;background:var(--papel);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:26px;
}
/* El atributo hidden debe ganarle a los display de arriba.
   Sin esto la puerta nunca se cierra y tapa la bandeja. */
#puerta[hidden]{display:none}
nav[hidden]{display:none}
header[hidden]{display:none}
#puerta form{width:100%;max-width:310px}
#puerta .marca{font-size:23px;margin-bottom:5px}
#puerta p{font-size:13.5px;color:var(--tenue);margin:14px 0 8px}
#puerta input{
  width:100%;padding:11px 12px;border:1px solid var(--linea);
  background:var(--ficha);font-family:'IBM Plex Mono',monospace;
  font-size:15px;color:var(--tinta);border-radius:2px;
}
#puerta input:focus{outline:2px solid var(--azul);outline-offset:1px}
#puerta button{
  width:100%;margin-top:9px;padding:11px;border:none;
  background:var(--tinta);color:var(--papel);
  font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;font-weight:500;
  border-radius:2px;cursor:pointer;
}
#puerta .mal{color:var(--regla);font-size:13px;margin-top:9px;min-height:18px}
</style>
</head>
<body>

<div id="puerta">
  <form onsubmit="entrar(event)">
    <div class="marca">EUCL<em>i</em>DIAN</div>
    <div class="sub">Elementos Tributarios</div>
    <p>Clave de acceso</p>
    <input id="clave" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="mal" id="mal"></div>
  </form>
</div>

<header hidden id="cab">
  <div class="marca">EUCL<em>i</em>DIAN</div>
  <div class="sub">Bandeja de revisión</div>
  <div class="cuenta">
    <div><b id="nPend">·</b><span>por revisar</span></div>
    <div><b id="nApr">·</b><span>aprobados</span></div>
  </div>
</header>

<nav hidden id="nav">
  <button data-f="obligatorias" aria-pressed="false">Obligatorias <b></b></button>
  <button data-f="urgentes" aria-pressed="false">Con plazo o retroactivas <b></b></button>
  <button data-f="conceptos" aria-pressed="false">Conceptos <b></b></button>
  <button data-f="pendientes" aria-pressed="true">Todo por revisar <b></b></button>
  <button data-f="aprobados" aria-pressed="false">Aprobados <b></b></button>
</nav>

<div hidden id="temas">
  <label for="selTema">Tema</label>
  <select id="selTema">
    <option value="">todos los temas</option>
  </select>
</div>

<main id="lista"></main>

<script>
let CLAVE = sessionStorage.getItem('euclidian_clave') || '';
let FILTRO = 'pendientes';
let TEMA = '';

function entrar(e){
  e.preventDefault();
  CLAVE = document.getElementById('clave').value;
  sessionStorage.setItem('euclidian_clave', CLAVE);
  cargar(true);
}

/* Glifos al modo de Byrne: la figura dice lo que diría una etiqueta. */
function glifo(d){
  const c = d.estado_vigencia !== 'vigente' ? '#B23A32'
          : d.clasificacion_obligatoriedad === 'obligatorio_dian_y_contribuyentes' ? '#2C4C8F'
          : '#C99A2E';
  if (d.estado_vigencia !== 'vigente')
    return `<svg class="glifo" width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
      <rect x="2" y="2" width="11" height="11" fill="none" stroke="${c}" stroke-width="1.5"/>
      <line x1="2" y1="13" x2="13" y2="2" stroke="${c}" stroke-width="1.5"/></svg>`;
  if (d.clasificacion_obligatoriedad === 'obligatorio_dian_y_contribuyentes')
    return `<svg class="glifo" width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
      <polygon points="7.5,2 13.5,13 1.5,13" fill="${c}"/></svg>`;
  return `<svg class="glifo" width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
    <circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="${c}" stroke-width="1.8"/></svg>`;
}

function leyenda(d){
  if (d.estado_vigencia !== 'vigente') return d.estado_vigencia;
  return d.clasificacion_obligatoriedad === 'obligatorio_dian_y_contribuyentes'
    ? 'obliga al contribuyente' : 'criterio de la DIAN';
}

/* Nombres legibles de los temas. Debe coincidir con clasificador.py */
const ETIQUETAS = {
  renta:'Renta', ganancia_ocasional:'Ganancia ocasional', iva:'IVA',
  consumo:'Impuesto al consumo', timbre:'Timbre', patrimonio:'Patrimonio',
  gmf:'GMF (4x1000)', simple:'Régimen SIMPLE', carbono:'Impuesto al carbono',
  plasticos:'Plásticos de un solo uso', saludables:'Impuestos saludables',
  licores_tabaco:'Licores y tabaco', normalizacion:'Normalización',
  retencion:'Retención en la fuente', retencion_iva:'ReteIVA',
  facturacion:'Facturación electrónica', nomina_electronica:'Nómina electrónica',
  exogena:'Información exógena', rut:'RUT', rub:'Beneficiario final',
  contabilidad:'Contabilidad y NIIF', devoluciones:'Devoluciones',
  firmeza:'Firmeza y prescripción', sanciones:'Sanciones',
  fiscalizacion:'Fiscalización', cobro:'Cobro y acuerdos de pago',
  beneficios:'Beneficios y conciliación', recursos:'Recursos y defensa',
  notificaciones:'Notificaciones', precios_transferencia:'Precios de transferencia',
  convenios:'Doble imposición', ece:'Entidades del exterior',
  aduanero:'Aduanero', cambiario:'Cambiario', comercio_exterior:'Comercio exterior',
  transporte:'Transporte de carga', zonas_francas:'Zonas francas',
  esal:'ESAL y donaciones', salud:'Salud', agropecuario:'Agropecuario',
  turismo:'Turismo', criptoactivos:'Criptoactivos', financiero:'Sector financiero',
  economia_naranja:'Economía naranja', formularios:'Formularios y recibos',
  calendario:'Calendario tributario', uvt:'UVT',
};

function nombreTema(t){ return ETIQUETAS[t] || t.replace(/_/g,' '); }

const MESES=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaCorta(f){
  if(!f) return '';
  const p=String(f).slice(0,10).split('-');
  return p.length===3 ? `${+p[2]} ${MESES[+p[1]]} ${p[0]}` : '';
}

/* El borrador se muestra aparte del campo de redaccion, nunca dentro.
   Debe quedar siempre claro cual texto paso por ojo humano y cual no. */
function bloqueBorrador(d){
  if(!d.resumen_borrador || d.resumen_humano) return '';
  const c = d.borrador_confianza || 'baja';
  const ojo = (d.borrador_advertencias||[]).length
    ? `<div class="ojo">Verifica: ${(d.borrador_advertencias||[]).map(esc).join(' · ')}</div>`
    : '';
  return `<div class="borrador ${c==='baja'?'baja':''}">
    <div class="borrador-cab">
      <span>Borrador automático</span>
      <span class="confianza ${c}">confianza ${c}</span>
    </div>
    <p>${esc(d.resumen_borrador)}</p>
    ${ojo}
    <button class="usar" onclick="usarBorrador('${d.id}')">Usar este texto y editarlo</button>
  </div>`;
}

/* Copia el borrador al campo editable. No lo guarda: eso lo decide
   el revisor al salir del campo o al aprobar. */
function usarBorrador(id){
  const t = document.getElementById('r-'+id);
  const b = document.querySelector(`article[data-id="${id}"] .borrador p`);
  if(!t||!b) return;
  t.value = b.textContent.trim();
  contar(id);
  t.focus();
}

function ficha(d){
  const temas = (d.temas||[]).filter(t=>!t.startsWith('dian:')&&t!=='boletin_mensual');
  const marcas = [
    `<span class="${d.estado_vigencia!=='vigente'?'alerta':'fuerte'}">${leyenda(d)}</span>`,
    d.materia ? `<span class="materia">${d.materia}</span>` : '',
    ...temas.slice(0,6).map(t=>`<span>${nombreTema(t)}</span>`),
    d.tiene_efectos_retroactivos ? '<span class="alerta">retroactivo</span>' : '',
  ].join('');

  return `<article data-id="${d.id}" data-temas="${temas.join('|')}"${d.resumen_humano?' class="escrito"':''}>
    <div class="fila-id">
      ${glifo(d)}
      <a class="codigo" href="${d.enlace_oficial}" target="_blank" rel="noopener">${d.numero_resolucion}</a>
      ${d.fecha_es_real?`<span class="fecha">${fechaCorta(d.fecha_publicacion)}</span>`:''}
    </div>
    <h2>${esc(d.titulo)}</h2>
    <div class="fuente">Lo que dice la DIAN</div>
    <p class="dice">${esc(d.descripcion_limpia||d.contenido||'').slice(0,460)}</p>
    <div class="marcas">${marcas}</div>
    ${bloqueBorrador(d)}
    <div class="escribir">
      <label for="r-${d.id}">En palabras simples
        <span class="contador" id="c-${d.id}">${(d.resumen_humano||'').length||0}</span></label>
      <textarea id="r-${d.id}"
        placeholder="Qué cambió, a quién le toca y qué hay que hacer."
        oninput="contar('${d.id}')"
        onblur="guardarResumen('${d.id}')">${esc(d.resumen_humano||'')}</textarea>
      <div class="pista">Si lo dejas vacío, el correo sale con el texto de la DIAN tal cual.
        <b>Lo que escribas aquí es lo que hace este boletín distinto.</b></div>
      ${d.resumen_humano?'<div class="sello">✓ redactado</div>':''}
    </div>
    <div class="acciones">
      <button class="si" onclick="decidir('${d.id}','aprobar')">Aprobar</button>
      <button onclick="decidir('${d.id}','descartar')">Descartar</button>
    </div>
  </article>`;
}

/* El contador empuja hacia lo breve: un contador ocupado no lee párrafos. */
function contar(id){
  const t = document.getElementById('r-'+id);
  const c = document.getElementById('c-'+id);
  if(!t||!c) return;
  const n = t.value.trim().length;
  c.textContent = n ? n+' / 320' : '0';
  c.className = 'contador' + (n>320 ? ' largo' : '');
}

/* Se guarda al salir del campo, para que no se pierda lo escrito. */
async function guardarResumen(id){
  const t = document.getElementById('r-'+id);
  if(!t) return;
  const valor = t.value.trim();
  if (t.dataset.guardado === valor) return;
  try{
    const r = await fetch('/api/decidir', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-clave':CLAVE},
      body: JSON.stringify({id:id, decision:'devolver', resumen:valor}),
    });
    if(!r.ok) throw new Error('no se guardó');
    t.dataset.guardado = valor;
    t.style.borderColor = '';
    const art = t.closest('article');
    if(art) art.classList.toggle('escrito', !!valor);
  }catch(e){
    t.style.borderColor = 'var(--regla)';
  }
}

function esc(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function cargar(primeraVez){
  const lista = document.getElementById('lista');
  lista.innerHTML = '<div class="aviso">Leyendo…</div>';
  try{
    const r = await fetch(
      `/api/documentos?estado=${FILTRO}` + (TEMA ? `&tema=${encodeURIComponent(TEMA)}` : ''),
      {headers:{'x-clave':CLAVE}});
    if (r.status === 401){
      sessionStorage.removeItem('euclidian_clave');
      document.getElementById('puerta').hidden = false;
      document.getElementById('mal').textContent = 'Clave incorrecta.';
      lista.innerHTML = '';
      return;
    }
    const data = await r.json();
    if (!r.ok) throw new Error(data.detalle || data.error);

    document.getElementById('puerta').hidden = true;
    document.getElementById('mal').textContent = '';
    document.getElementById('cab').hidden = false;
    document.getElementById('nav').hidden = false;
    document.getElementById('temas').hidden = false;
    document.getElementById('nPend').textContent = data.pendientes;
    document.getElementById('nApr').textContent = data.aprobados;
    pintarConteos(data.conteos || {});
    poblarTemas();

    if (!data.documentos.length){
      lista.innerHTML = FILTRO==='pendientes'
        ? '<div class="aviso"><b>Todo revisado</b>No queda nada por decidir. Vuelve cuando el scraper traiga cambios nuevos.</div>'
        : '<div class="aviso"><b>Nada aquí todavía</b>Aprueba documentos en «Por revisar» y aparecerán aquí.</div>';
      return;
    }
    lista.innerHTML = data.documentos.map(ficha).join('');
  }catch(e){
    lista.innerHTML = `<div class="error">No se pudo leer la base.
      <code>${esc(e.message)}</code></div>`;
  }
}

async function decidir(id, decision){
  const art = document.querySelector(`article[data-id="${id}"]`);
  const t = document.getElementById('r-'+id);
  const resumen = t ? t.value.trim() : undefined;
  if (art) art.style.opacity = '.4';
  try{
    const r = await fetch('/api/decidir', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-clave':CLAVE},
      body: JSON.stringify({id, decision, resumen}),
    });
    if (!r.ok) throw new Error((await r.json()).detalle || 'falló');
    if (art) art.remove();
    const n = document.getElementById('nPend');
    n.textContent = Math.max(0, (+n.textContent||0) - 1);
    if (decision==='aprobar'){
      const a = document.getElementById('nApr');
      a.textContent = (+a.textContent||0) + 1;
    }
    if (!document.querySelector('article')) cargar();
  }catch(e){
    if (art){ art.style.opacity='1';
      art.insertAdjacentHTML('beforeend',
        `<div class="error" style="margin-top:10px">No se guardó la decisión.<code>${esc(e.message)}</code></div>`);
    }
  }
}

/* El numero en cada pestana dice cuanto hay antes de entrar. */
function pintarConteos(c){
  document.querySelectorAll('nav button').forEach(b=>{
    const n = c[b.dataset.f];
    const marca = b.querySelector('b');
    if (marca) marca.textContent = (n === undefined ? '' : n);
  });
}

/* El selector de temas se arma con lo que hay en pantalla, no con una
   lista fija: asi nunca ofrece un tema que no devuelva nada. */
let TEMAS_VISTOS = new Set();
function poblarTemas(){
  document.querySelectorAll('article').forEach(a=>{
    (a.dataset.temas || '').split('|').filter(Boolean).forEach(t=>TEMAS_VISTOS.add(t));
  });
  const sel = document.getElementById('selTema');
  const actual = sel.value;
  const orden = [...TEMAS_VISTOS].sort((a,b)=>nombreTema(a).localeCompare(nombreTema(b),'es'));
  sel.innerHTML = '<option value="">todos los temas</option>' +
    orden.map(t=>`<option value="${t}">${nombreTema(t)}</option>`).join('');
  sel.value = actual;
}

document.getElementById('selTema').addEventListener('change', e=>{
  TEMA = e.target.value;
  cargar();
});

document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  FILTRO = b.dataset.f;
  document.querySelectorAll('nav button').forEach(x=>
    x.setAttribute('aria-pressed', String(x===b)));
  cargar();
});

if (CLAVE) cargar(); else document.getElementById('puerta').hidden = false;
</script>
