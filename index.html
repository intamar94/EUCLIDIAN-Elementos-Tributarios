<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1E9">
<title>EUCLIDIAN · Bandeja de revisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/fichas.css">
<style>
/* La puerta tiene aspecto propio: es lo primero que alguien ve, y
   conviene que se parezca a lo que el producto es.

   La ilustracion se sirve como archivo y no incrustada en el HTML.
   Una imagen de 1,4 MB en base64 vuelve ilegible el documento y se
   trunca al copiarlo, que fue justo lo que paso antes: quedaba el
   icono roto porque los datos venian cortados. */
body{background:#f3f0e8}
#puerta{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:28px 16px;box-sizing:border-box;
  background:repeating-linear-gradient(to bottom,#f4f1e9 0,#f4f1e9 31px,#e5e0d5 32px);
}
#puerta[hidden]{display:none}
#puerta form{
  width:min(720px,100%);box-sizing:border-box;background:#fbfaf5;
  border:1px solid #ded8cb;border-radius:22px;overflow:hidden;
  box-shadow:0 18px 45px rgba(61,54,42,.12);text-align:center;
  padding:0 48px 42px;
}
#puerta .ilustracion{
  display:block;width:calc(100% + 96px);height:auto;max-height:360px;
  object-fit:cover;margin:0 -48px;border-bottom:2px solid #b83b2f;
  background:#f4f1e9;
}
#puerta .marca{
  font-family:Spectral,Georgia,serif;font-size:54px;letter-spacing:.03em;
  line-height:1;margin-top:30px;color:#202020;
}
#puerta .marca em{font-style:normal;color:#b83b2f}
#puerta .sub{
  font-family:'IBM Plex Sans',sans-serif;text-transform:uppercase;
  letter-spacing:.28em;font-size:14px;color:#6c735f;margin-top:13px;
}
#puerta p{
  font-family:'IBM Plex Sans',sans-serif;text-transform:uppercase;
  letter-spacing:.18em;font-size:13px;color:#777568;margin:42px 0 16px;
}
#puerta input{
  width:100%;height:58px;box-sizing:border-box;border:1px solid #c8c1b4;
  border-radius:10px;background:#fffdf8;padding:0 18px;
  font-family:'IBM Plex Sans',sans-serif;font-size:17px;color:#282723;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.03);
}
#puerta input:focus{outline:2px solid #b83b2f;outline-offset:2px}
#puerta button{
  width:100%;height:58px;margin-top:18px;border:0;border-radius:10px;
  background:#b83b2f;color:#fff;font-family:'IBM Plex Sans',sans-serif;
  font-size:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;box-shadow:0 5px 12px rgba(120,40,30,.18);
}
#puerta button:hover{background:#a93228}
#puerta .mal{
  font-family:'IBM Plex Sans',sans-serif;color:#b83b2f;font-size:13px;
  margin-top:12px;min-height:18px;
}
@media(max-width:620px){
  #puerta{padding:12px}
  #puerta form{padding:0 22px 28px;border-radius:16px}
  #puerta .ilustracion{width:calc(100% + 44px);margin:0 -22px;max-height:235px}
  #puerta .marca{font-size:39px;margin-top:24px}
  #puerta .sub{font-size:11px;letter-spacing:.22em}
  #puerta p{margin-top:30px}
}
</style>
</head>
<body>

<div id="puerta">
  <form onsubmit="entrar(event)">
    <img class="ilustracion" src="/euclides.png"
         alt="Euclides explicando la DIAN a sus discípulos"
         width="1400" height="770">
    <div class="marca">EUCL<em>i</em>DIAN</div>
    <div class="sub">Elementos Tributarios</div>
    <p>Clave de acceso</p>
    <input id="clave" type="password" autocomplete="current-password" required
           placeholder="Ingrese su contraseña">
    <button type="submit">Entrar</button>
    <div class="mal" id="mal"></div>
  </form>
</div>

<header hidden id="cab">
  <div class="marco cab">
    <div>
      <div class="marca">EUCL<em>i</em>DIAN</div>
      <div class="sub">Bandeja de revisión</div>
    </div>
    <div class="cifras">
      <div><b id="nPend">·</b><span>por revisar</span></div>
      <div><b id="nApr">·</b><span>aprobados</span></div>
    </div>
    <div class="derecha">
      <span class="sello" id="sello"></span>
      <button class="recargar" id="btnRecargar" onclick="cargar()">Actualizar</button>
    </div>
  </div>
</header>

<div class="controles marco" hidden id="controles">
  <div class="grupo tiras" id="gPrioridad">
    <button data-v="" aria-pressed="true">Todas <b></b></button>
    <button class="pri-accion" data-v="accion" aria-pressed="false">Acción requerida <b></b></button>
    <button class="pri-importante" data-v="importante" aria-pressed="false">Importantes <b></b></button>
    <button data-v="informativa" aria-pressed="false">Informativas <b></b></button>
  </div>

  <details class="mas">
    <summary>Más filtros</summary>
    <div class="grupo tiras" id="gEstado">
      <button data-v="pendientes" aria-pressed="true">Por revisar <b></b></button>
      <button data-v="obligatorias" aria-pressed="false">Obligatorias <b></b></button>
      <button data-v="urgentes" aria-pressed="false">Plazo o retroactivas <b></b></button>
      <button data-v="conceptos" aria-pressed="false">Conceptos <b></b></button>
      <button data-v="aprobados" aria-pressed="false">Aprobados <b></b></button>
    </div>
    <div class="selectores">
      <select id="selTema" aria-label="Filtrar por tema">
        <option value="">Todos los temas</option>
      </select>
      <select id="selOrden" aria-label="Ordenar">
        <option value="recientes">Más recientes primero</option>
        <option value="prioridad">Lo urgente primero</option>
        <option value="antiguos">Más antiguos primero</option>
      </select>
    </div>
  </details>
</div>

<main class="marco" id="lista"></main>
<div class="paginas marco" id="paginas"></div>

<script src="/fichas.js" defer></script>
<script src="/bandeja.js" defer></script>
</body>
</html>
